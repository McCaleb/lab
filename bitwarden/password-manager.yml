---
- name: Consume secrets from the Bitwarden Password Manager vault
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Fail early when the vault session is missing
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'BW_SESSION') | length > 0
        fail_msg: >-
          BW_SESSION is not set. Run scripts/bw-session.sh and export the
          session key before running this play.
      delegate_to: localhost
      run_once: true

    # Every reference to a lookup variable shells out to bw again. Resolve
    # once per host and reuse the fact if the value is needed repeatedly.
    - name: Resolve the database credentials once
      ansible.builtin.set_fact:
        resolved_db_user: "{{ db_admin_user }}"
        resolved_db_password: "{{ db_admin_password }}"
      no_log: true

  tasks:
    - name: Confirm the lookup resolved without printing the value
      ansible.builtin.debug:
        msg: >-
          Resolved credentials for {{ resolved_db_user }}
          ({{ resolved_db_password | length }} character password)

    - name: Render the application config
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/myapp/app.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart myapp

  handlers:
    - name: Restart myapp
      ansible.builtin.systemd_service:
        name: myapp
        state: restarted
...