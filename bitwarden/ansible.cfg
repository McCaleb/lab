[defaults]
inventory = inventory.ini
collections_path = ./collections:~/.ansible/collections
roles_path = ./roles:~/.ansible/roles
# stdout_callback = yaml seems to no longer work. 
# The community.general.yaml callback was removed in community.general sometime around v12.
# It's superseded by this option on the built-in default callback.
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False
forks = 20

# Both Bitwarden lookups shell out to a local CLI *on the controller*.
# BW_SESSION (Password Manager) or BWS_ACCESS_TOKEN (Secrets Manager) must already be in the env of the ansible-playbook process. 

[ssh_connection]
pipelining = True