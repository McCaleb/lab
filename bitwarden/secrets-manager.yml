---
- name: Grab secrets from Bitwarden
  hosts: all
  gather_facts: false
  vars:
    db_secret_id: "2bc23e48-4932-40de-a047-5524b7ddc972"
    api_secret_id: "9d89af4c-eb5d-41f5-bb0f-4ae81215c768"
  pre_tasks:
    - name: Fail when the access token is missing
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BWS_ACCESS_TOKEN') | length > 0
        fail_msg: "BWS_ACCESS_TOKEN is not set."
      delegate_to: localhost
      run_once: true

    - name: Resolve the secrets once
      ansible.builtin.set_fact:
        resolved_db_user: myapp
        resolved_db_password: >-
          {{ lookup('community.general.bitwarden_secrets_manager', db_secret_id).value }}
        monitoring_api_key: >-
          {{ lookup('community.general.bitwarden_secrets_manager', api_secret_id).value }}
      no_log: true

  tasks:
    - name: Show the secret key name without its value
      ansible.builtin.debug:
        msg: >-
          {{ lookup('community.general.bitwarden_secrets_manager',
          db_secret_id).key }}

    - name: Render the config
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/myapp/app.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true
...